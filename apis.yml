name: Lyric
description: >-
  Lyric is an AI-powered supply chain software company, founded in 2022 and
  backed by Insight Partners. Its Lyric Studio platform lets enterprises model,
  plan, and optimize their supply chains across four composable layers — Data
  (enterprise-grade data management and integrations), Algorithms (advanced
  supply chain science), Workflows (flexible, composable processes), and Models
  & Apps (ready-to-use applications). The platform spans network modeling,
  transportation optimization, inventory management, forecasting, routing, and
  scheduling. Lyric does not publish a public developer API surface; its product
  documentation at docs.lyric.tech is gated behind a Lyric Studio login. It does
  operate a public SafeBase security and trust portal documenting SOC 2, SOC 3,
  ISO/IEC 27001, GDPR, CCPA, CPRA, and CSA STAR Level 1 posture plus a
  responsible disclosure program.
